# All strategy/risk tunables live here. Nothing thresholded should be hard-coded in Python.

trading:
  mode: paper                    # "paper" or "live". "live" also requires i_understand_live_trading: true
  host: 127.0.0.1
  port: 4002                     # IB Gateway paper=4002, TWS paper=7497 (live=4001/7496, refused unless mode=live)
  client_id: 11
  i_understand_live_trading: false
  use_rth: false                 # false = include pre-market/after-hours bars (needed for gap scanning)

execution:
  flatten_limit_offset_pct: 5.0  # outside RTH, emergency flattens are marketable limits this % through the last price (market orders just queue until 09:30)
  stop_limit_offset_pct: 0.5     # stop-loss is a stop-limit order; limit sits this % beyond the trigger (IBKR rejects plain market/stop orders outside RTH)

risk:
  daily_loss_limit_pct: 0.02     # halt new entries once daily realized loss exceeds this fraction of start-of-day equity
  flatten_on_daily_loss_limit: true  # force-close open positions when the daily halt triggers -- enabled for the unattended overnight test since no one can intervene manually
  max_concurrent_positions: 5
  reserved_top_tier_slots: 1       # slots held back exclusively for scanner_rank <= reserved_top_tier_max_rank, used only once the other slots are full
  reserved_top_tier_max_rank: 3    # inclusive
  max_position_pct_of_buying_power: 0.25  # outer safety ceiling as a fraction of current buying power -- backstop, not the primary sizing rule below
  daily_profit_goal_usd: null      # set to enable "profit cushion" sizing; null = feature off, always full size
  cushion_profit_fraction: 0.25    # trade at reduced size until this fraction of the daily goal is realized
  cushion_size_fraction: 0.25      # size multiplier applied while under the cushion threshold
  first_entry_pct_of_funds: 0.10   # notional CAP on a first entry (fraction of AvailableFunds) -- no longer the primary sizing rule
  addon_pct_of_funds: 0.05         # notional CAP on the one allowed add-on lot; a third signal on the same symbol is rejected
  risk_per_trade_pct: 0.005        # PRIMARY sizing rule: fraction of start-of-day equity lost if the stop fills (0.5% ~= $235 on $47k).
                                   # Share count = budget / (entry - stop), so a wider structural stop buys fewer shares instead of
                                   # risking more dollars, and every trade risks the same amount regardless of stop distance.
  addon_risk_pct: 0.0025           # the pyramid add-on risks half a first entry's budget
  max_stop_distance_pct: 8.0       # was 2.0 -- an outer catastrophe bound now, not the mechanism that limits per-trade loss.
                                   # At 2% it overrode the strategies' own structural stops on nearly every trade and parked them
                                   # inside normal 1-minute noise for a $1-3 low-float name: 09-15 and 09-16 both closed with a
                                   # 100% stop-out rate and zero profit tiers filled. risk_per_trade_pct now caps the dollars.
  rejected_signal_cooldown_seconds: 300  # a signal REJECTED for capacity makes its symbol eligible again after this long,
                                         # instead of burning that strategy's one daily shot at the symbol (96 setups were
                                         # silently discarded this way on 2026-09-14). An ACCEPTED entry still uses up the shot.
  no_entry_before_et: "06:30"       # no new entries before this ET time -- 09-21 fired 11 signals in the first second of the 04:00 open; 06:30 waits for real premarket volume
  addon_min_seconds_after_first_entry: 120  # the pyramid add-on must come at least this long after the first lot
  count_unrealized_loss_in_daily_limit: true  # daily loss limit = realized + open positions' unrealized loss
  entry_fill_timeout_seconds: 300  # cancel an entry order still unfilled this long after submission -- these are DAY limit
                                   # orders, so without it they rest until 15:55 and can fill hours after the setup is dead
                                   # (RLGT filled 3h56m late on 2026-09-15). Filled shares keep their stop; only the rest is pulled.

pullback_quality:
  # Entry-time "dip or dump" dump-avoidance checks, shared by bull_flag/abcd's
  # pullback validity gate -- same underlying signals already used for the
  # reversal *exit* (see exits.reversal_exit below), now also blocking entry
  # into a pullback that already shows dump characteristics.
  reject_topping_tail: true
  topping_tail_wick_ratio: 2.0
  reject_high_volume_red_bar: true
  high_volume_red_bar_multiple: 2.0
  # Multi-timeframe confirmation: re-check MACD/topping-tail on 5-minute bars
  # resampled from the existing 1-minute history -- a clean 1-minute pullback
  # can still sit under a deteriorating 5-minute trend.
  require_5m_macd_confirmation: true
  reject_5m_topping_tail: true
  require_pullback_lighter_than_prior_green_bar: true  # each pullback bar's volume < the specific green candle right before the pullback
  require_rising_volume_on_advance: true  # volume should trend up alongside price during the up-move -- declining volume on the advance is a divergence warning

strategies:
  gap_and_go:
    enabled: true
    min_gap_pct: 10.0
    min_price: 1.0
    max_price: 20.0
    min_rel_volume: 5.0            # hard minimum -- Ross: "if it doesn't have at least 5x average volume, it's not worth touching"
    breakout_lookback_bars: 30    # bars used to compute pre-market/opening-range high
    stop_buffer_pct: 1.0          # stop placed this % below the breakout level
    target_r_multiple: 2.0        # profit target expressed as multiple of risk (R)
    enable_float_filter: true      # skips symbols missing from config/float_list.csv (graceful no-op until that file exists)
    max_float_shares: 10000000     # matches Ross Cameron's "5 Pillars" filter (<=10M, aggressive traders use 5M)
    min_float_rotation: 0.0        # day's cumulative volume / float; 0 = disabled (also needs float_list.csv data)
    min_breakout_candle_strength: 0.0  # (close-open)/(high-low) of the breakout bar; 0.0 = must close net-bullish, not just above the level
    max_extension_atr_multiple: 2.5  # reject if the breakout bar already closed this many ATRs past the opening-range high -- GDC/DCOY/EDBL (2026-09-22) all chased a bar that had already run 3-40% past the level and reversed within minutes
  bull_flag:
    enabled: true
    min_spike_pct: 5.0            # minimum initial move (over lookback) to qualify as a spike
    max_pullback_pct: 50.0        # flag pullback must retrace no more than this % of the spike
    min_consolidation_bars: 1     # "1 or more red candles" -- a single-bar micro pullback is the ideal case
    max_consolidation_bars: 15
    stop_buffer_pct: 0.5
    target_r_multiple: 2.0
    min_rel_volume: 5.0           # same hard floor -- blanket five-pillars criterion, not gap_and_go-specific
    min_breakout_candle_strength: 0.0
  abcd:
    enabled: true
    min_ab_move_pct: 5.0          # minimum A->B spike size
    min_bc_pullback_pct: 20.0     # minimum pullback size from A before it counts as B
    max_bc_pullback_pct: 60.0
    stop_buffer_pct: 0.5
    target_r_multiple: 2.0
    min_rel_volume: 5.0           # same hard floor -- blanket five-pillars criterion
    min_breakout_candle_strength: 0.0
  vwap_reversion:
    enabled: true
    max_vwap_distance_pct: 1.5    # price must be within this % of VWAP to qualify for a reversion entry
    red_to_green_volume_multiple: 5.0  # was 2.0 -- raised to match Ross's stated 5x hard floor
    min_rel_volume: 5.0           # applies to the vwap_bounce setup, which previously had no relative-volume gate at all
    stop_buffer_pct: 0.5
    target_r_multiple: 1.5
    max_extension_atr_multiple: 2.5  # same guard as gap_and_go's field of the same name, applied to both sub-setups' own trigger level (VWAP / prior day's close)
  inverted_head_and_shoulders:
    enabled: false                 # secondary/non-primary pattern from a live trade recap, not one of the four core taught setups -- off until validated against real sessions
    min_rel_volume: 5.0            # same hard floor -- blanket five-pillars criterion
    max_shoulder_asymmetry_pct: 40.0  # how far apart the two shoulder lows may sit, relative to the head low, before the shape stops reading as a head-and-shoulders
    min_head_depth_pct: 3.0        # head must dip meaningfully below the neckline, not a noise-level 1-minute-bar wiggle
    stop_buffer_pct: 0.5
    target_r_multiple: 2.0
    min_breakout_candle_strength: 0.0

news:
  enabled: true
  lookback_hours: 48          # how far back to check for a catalyst headline when a symbol is onboarded
  provider_codes: ""          # e.g. "BRFG+DJNL"; empty = auto-discover entitled providers via reqNewsProviders()

notifications:
  enabled: true                # requires webhook URLs set in .env (see .env.example) -- never put URLs here
  notify_on_signal: true       # -> trade_activity channel: an entry signal was accepted and sized
  notify_on_fill: true         # -> trade_activity channel: every buy/sell/trim fill, raw/unbatched
  notify_on_entry_summary: true  # -> trade_activity_summary channel: one curated embed per completed entry/add-on fill burst
  notify_on_kill_switch: true  # -> kill_switch channel: manual kill switch, IBKR connection loss
  notify_on_limits: true       # -> limits channel: daily-loss-limit halt, EOD flatten, IBKR session failure
  notify_on_pnl: true          # -> pnl channel: per-trade + running daily realized P&L on every closing/trim fill

exits:
  profit_tiers:            # partial take-profit legs, closing `pct` of the original size at each `r_multiple`; whatever remains rides the breakeven/trailing logic below
    - r_multiple: 1.0
      pct: 0.34
    - r_multiple: 2.0
      pct: 0.33
  breakeven:
    enabled: true
    trigger_r_multiple: 1.0   # once price reaches this many R, move the stop to entry
  trailing:
    enabled: true
    method: atr             # "ema" (EMA-9) or "atr"
    atr_period: 14
    atr_multiple: 1.5
  reversal_exit:
    enabled: false
    topping_tail_wick_ratio: 2.0   # upper wick >= this multiple of the candle body counts as a topping tail
    volume_burst_multiple: 2.0     # red-bar volume >= this multiple of recent avg volume counts as a burst
    volume_lookback_bars: 10       # bars used to compute the "recent average" volume baseline
    momentum_exhaustion_lookback_bars: 3  # consecutive shrinking-body + shrinking-volume green bars = exhaustion warning
  eod_flatten_time: "15:55"   # force-flatten all positions at/after this ET time
  risk_loop_interval_seconds: 15

scanner:
  scan_code: TOP_PERC_GAIN
  location_code: STK.US.MAJOR
  above_price: 1.0
  below_price: 20.0
  above_volume: 10000     # coarse liquidity floor only, NOT the relative-volume gate (IBKR scanner can't compute
                           # true relative volume). The real 5x minimum is each strategy's min_rel_volume above --
                           # raise strategies.*.min_rel_volume to 20.0 to tighten the funnel when there's too much
                           # to look through (Ross's own example: 5x -> ~100 candidates/day, 20x -> ~20)
  refresh_seconds: 5
  max_candidates: 25

data_watchdog:
  # Guards against the 2026-09-15 incident: RETO (that day's #1 gainer) and
  # several other symbols got one onboarding log line then went silent for
  # the rest of the session -- root-caused to unbounded live subscriptions
  # (no cleanup, ever) combined with a live-line cap and a transient IBKR
  # "HMDS server disconnect" that killed ~179 subscriptions in one burst
  # with no self-healing. See DataWatchdogConfig docstring for full detail.
  enabled: true
  check_interval_seconds: 60
  stale_after_seconds: 180       # no live bar callback in this long -> resubscribe
  max_concurrent_subscriptions: 90   # self-imposed cap, below where things broke live (~156-170)
  inactive_unsubscribe_seconds: 1800 # no position + out of scanner top-N this long -> evictable

position_reconciliation:
  # Guards against the 2026-09-16 incident: NRXS sat as an unprotected
  # 850-share naked short for ~3h53m after a reconnect silently orphaned
  # its stop-fill listeners. Periodically checks IBKR's own position/order
  # state directly and immediately flattens any symbol found with a real
  # position but no resting protective stop -- see
  # PositionReconciliationConfig docstring for full detail.
  enabled: true
  check_interval_seconds: 30

journal:
  db_path: data/journal.sqlite3

kill_switch:
  flag_file: data/KILL_SWITCH

logging:
  level: DEBUG
  file: data/warrior_bot.log
